<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Óptica — Iniciar sesión</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f5f5f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #fff;
      border: 1px solid #e5e5e0;
      border-radius: 14px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.04);
    }

    .logo {
      font-size: 1.3rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 0.25rem;
    }
    .logo span { color: #2563eb; }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #6b7280;
      margin-bottom: 1.75rem;
    }

    .form-group { margin-bottom: 1.1rem; }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: #374151;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 0.6rem 0.85rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border 0.15s;
    }
    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px #2563eb22;
    }

    .btn-login {
      width: 100%;
      padding: 0.65rem;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.92rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.15s;
    }
    .btn-login:hover { background: #1d4ed8; }

    .error-msg {
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      padding: 0.55rem 0.8rem;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo">Óptica <span>Blessed</span></div>
    <div class="subtitle">Inicia sesión para continuar</div>

    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="usuario" required autofocus>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="contrasena" required>
      </div>
      <button type="submit" class="btn-login">Iniciar sesión</button>
    </form>
  </div>


</body>
</html>
